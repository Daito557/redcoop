name: Build Windows client exe

on:
  push:
    branches: [ main ]
    paths:
      - 'redcoop_client.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows-client-exe.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name redcoop_client redcoop_client.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redcoop-client-windows
          path: dist/redcoop_client.exe
